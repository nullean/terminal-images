name: CI

# nuget.org's trusted publishing policy names this file, so releasing happens here too: publishing the
# release-drafter draft (web UI, phone or `mise run release publish`) creates the tag and fires `release: published`.
on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# What runs when:
#   every trigger  build, test and pack the libraries on linux, windows and macos, and publish the NativeAOT smoke app
#   release        all of the above on the tag, then the release job packs at the tag's version and pushes to nuget.org

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # the release job publishes what this job builds; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Build
        run: dotnet build -c Release

      - name: Check formatting (curb)
        run: dotnet tool restore && dotnet curb check .

      - name: Test
        run: dotnet test -c Release --no-build

      # Fails on any IL2xxx / IL3xxx trim or AOT warning, because warnings are errors.
      - name: NativeAOT smoke publish
        run: dotnet publish examples/Nullean.TerminalImages.Cat -c Release -o .artifacts/aot-smoke

      - name: Run the NativeAOT smoke app
        shell: bash
        run: |
          EXT=""
          [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          ls -la ".artifacts/aot-smoke/tcat${EXT}"
          ".artifacts/aot-smoke/tcat${EXT}" --diagnostics
          # A forced protocol draws even though there is no terminal here: half blocks need no escape-sequence support.
          bytes="$(".artifacts/aot-smoke/tcat${EXT}" --protocol blocks --max-columns 40 examples/sunset.png | wc -c)"
          echo "half blocks: $bytes bytes"
          [ "$bytes" -gt 1000 ]

      # The unit tests use a fake terminal. This one runs the published binary in a pseudo-terminal and plays the terminal: it
      # checks raw mode, the read timeout and that the terminal is restored. macOS and Linux only (Windows detection is environment-only).
      - name: Terminal probe test (pty)
        if: runner.os != 'Windows'
        run: python3 -I tests/pty/probe_test.py "$PWD/.artifacts/aot-smoke/tcat"

      - name: Pack the libraries
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -o .artifacts/package-output
          done
          ls .artifacts/package-output

      - name: Upload the library packages
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-libraries
          path: .artifacts/package-output/*.nupkg
          if-no-files-found: error

  # Publishing to nuget.org: only when a release is published, and only once the build job (every OS, the NativeAOT smoke
  # app and the pty test) and the workflow audit have passed on the tag. The shared release workflow packs at the tag's
  # version, checks every package carries it, and pushes with trusted publishing: nuget.org trusts this workflow file
  # (ci.yml) through a policy that names no environment, so none is passed. Publishing the draft already created the
  # GitHub release and its notes; this repository produces no public API report to append to them.
  # packs at the release's tag in the shared workflow...
  release:
    if: github.event_name == 'release'
    needs: [build, zizmor]
    uses: nullean/.github/.github/workflows/release.yml@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
    permissions:
      contents: write
    with:
      pack-task: pack
      packages-path: .artifacts/package-output

  # ...and publishes from this file: nuget.org's trusted publishing checks that the token's workflow is this ci.yml,
  # which a job inside the shared workflow would not be.
  publish:
    if: github.event_name == 'release'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # append the public API changes to the release notes
      id-token: write # NuGet trusted publishing: exchange the OIDC token for a short-lived key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - uses: nullean/.github/actions/nuget-publish@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
        with:
          user: ${{ secrets.NUGET_USER }}
          packages-path: packages
  # Static analysis of these workflows (nullean/.github).
  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
    permissions:
      contents: read
